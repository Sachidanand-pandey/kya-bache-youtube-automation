
name: Kya Bache Daily YouTube Automation

on:
  workflow_dispatch:
    inputs:
      upload_to_youtube:
        description: "Upload generated video to YouTube"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: write

concurrency:
  group: kya-bache-daily-video
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          fc-cache -f

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Bal Hanuman Ji video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: python main.py

      - name: Check generated files
        run: |
          test -s output/daily_video.mp4
          test -s output/thumbnail.jpg
          test -s output/story.json
          test -s output/upload_metadata.json
          test -s output/story_history.json

      - name: Save story history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/story_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Bal Hanuman story history [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Save video for review
        uses: actions/upload-artifact@v4
        with:
          name: bal-hanuman-generated-video
          path: |
            output/daily_video.mp4
            output/thumbnail.jpg
            output/story.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload video to YouTube
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_youtube == true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
        run: python output/upload_video.py
