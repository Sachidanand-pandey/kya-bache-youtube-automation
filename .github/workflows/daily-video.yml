
name: Kya Bache Daily Video Automation

on:
  workflow_dispatch:

  schedule:
    - cron: "30 0 * * *" # 6:00 AM IST
    - cron: "30 12 * * *" # 6:00 PM IST

permissions:
  contents: read

concurrency:
  group: kya-bache-daily-video
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate full story and separate quiz Short
        run: |
          python main.py

      - name: Verify generated videos
        run: |
          test -s output/daily_video.mp4
          test -s output/daily_short.mp4
          ls -lh output/daily_video.mp4 output/daily_short.mp4

      - name: Upload both videos to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python output/upload_video.py
