
name: Kya Bache Daily YouTube Automation

on:
  workflow_dispatch:

  schedule:
    # Every day at 6:00 AM IST (00:30 UTC)
    - cron: '30 0 * * *'

permissions:
  contents: write

concurrency:
  group: kya-bache-daily-video
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Step 3: Install FFmpeg and Hindi fonts
      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          fc-cache -f

      # Step 4: Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 5: Generate story, images, audio and video
      - name: Generate children's story video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python main.py

      # Step 6: Check generated files
      - name: Check generated files
        run: |
          test -s output/daily_video.mp4
          test -s output/thumbnail.jpg
          test -s output/story.json
          test -s output/upload_metadata.json
          test -s output/story_history.json

      # Step 7: Save story history
      - name: Save story history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f output/story_history.json

          if ! git diff --cached --quiet; then
            git commit -m "Update story history [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      # Step 8: Save generated video and thumbnail
      - name: Save generated video and thumbnail
        uses: actions/upload-artifact@v4
        with:
          name: kya-bache-daily-video
          path: |
            output/daily_video.mp4
            output/thumbnail.jpg
            output/story.json
            output/upload_metadata.json
          if-no-files-found: error
          retention-days: 7

      # Step 9: Upload video to YouTube
      - name: Upload video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
        run: python output/upload_video.py
